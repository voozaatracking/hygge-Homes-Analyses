<!doctype html>
<html lang="de">
  <body style="margin:0;padding:24px;background:#f4efe6;font-family:Arial,Helvetica,sans-serif;color:#3b3733;">
    <div style="max-width:560px;margin:0 auto;background:#fbf8f2;border:1px solid #e0d8c8;border-radius:12px;padding:28px;">
      <p style="font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:#8c8377;margin:0 0 16px;">Hygge Homes Analyse</p>
      <h1 style="font-size:20px;margin:0 0 12px;">Passwort zurücksetzen</h1>
      <p style="font-size:15px;line-height:1.5;margin:0 0 20px;">
        Über den folgenden Link kannst du ein neues Passwort festlegen.
      </p>
      <p style="margin:0 0 24px;">
        <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=recovery&next=/auth/set-password"
           style="display:inline-block;background:#3b3733;color:#f4efe6;text-decoration:none;padding:10px 18px;border-radius:8px;font-size:14px;">
          Neues Passwort festlegen
        </a>
      </p>
      <p style="font-size:12px;line-height:1.5;color:#75705f;margin:0;">
        Falls du kein neues Passwort angefordert hast, kannst du diese E-Mail ignorieren. Dein Passwort bleibt unverändert. Der Link ist zeitlich begrenzt gültig.
      </p>
    </div>
  </body>
</html>
